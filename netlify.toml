[build]
  command = "node scripts/create-netlify-config.mjs"
  publish = "netlify-site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/admin-users"
  to = "/.netlify/functions/admin-users"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
